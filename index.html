<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#122139">
  <meta name="description" content="Charly e Isabel. Perdón por cada uno de mis errores, no te quiero perder.">
  <title>Isabel | Charly y Isabel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body class="rose-classic-page">
  <!-- Fondo dinámico con cielo estrellado y luciérnagas de Ray -->
  <canvas id="ambient-canvas" class="ambient-canvas" aria-hidden="true"></canvas>



  <!-- ESCENA 2: CORAZÓN FLECHADO CON I+J (TOTALMENTE TRANSPARENTE EN EL CIELO) -->
  <aside class="bayou-tree-trunk-scene" aria-label="Corazón flechado de amor I+J">
    <div class="bark-wood-texture">
      <!-- Gráfico del Corazón Flechado Tallado en Luz de Fuego/Luciérnaga -->
      <svg class="carved-heart-graphic" viewBox="0 0 250 250" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Resplandor de corteza incandescente -->
          <filter id="carved-ember-glow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="core" />
            <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="glow1" />
            <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="glow2" />
            <feMerge>
              <feMergeNode in="glow2" />
              <feMergeNode in="glow1" />
              <feMergeNode in="core" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>

        <g filter="url(#carved-ember-glow)">
          <!-- Trazo exterior del Corazón Tallado a mano -->
          <path class="carved-heart-stroke" d="M120,188 C72,160 38,124 44,76 C48,44 76,32 104,42 C113,45 117,50 120,56 C123,50 127,45 136,42 C164,32 192,44 196,76 C202,124 168,160 120,188 Z" />

          <!-- Flecha de Cupido: Punta arriba a la izquierda (↖), Plumas abajo a la derecha (↘) -->
          <!-- Punta de la flecha en la parte superior izquierda -->
          <path class="arrow-carved-tip" d="M24,56 L44,58 L36,76 Z" />
          <!-- Vástago de la flecha cruzando el corazón -->
          <path class="arrow-carved-shaft" d="M38,66 L208,172" />
          <!-- Plumas de la flecha en la parte inferior derecha -->
          <path class="arrow-carved-feathers" d="M192,154 L216,172 M198,164 L222,182 M186,164 L210,182" />

          <!-- Letras I+J talladas exactamente como en la película (abajo a la derecha) -->
          <!-- Letra I -->
          <path class="carved-letter-line" d="M146,200 L166,200 M156,200 L156,230 M146,230 L166,230" />
          <!-- Signo + -->
          <path class="carved-plus-line" d="M174,215 L188,215 M181,208 L181,222" />
          <!-- Letra J -->
          <path class="carved-letter-line" d="M196,202 L216,202 M210,202 L210,224 C210,234 198,236 192,228" />
        </g>
      </svg>

      <!-- Chispas que se desprenden del grabado -->
      <div class="carved-firefly-sparks">
        <span class="spark sp1">✨</span>
        <span class="spark sp2">✦</span>
        <span class="spark sp3">⭐</span>
      </div>
    </div>
  </aside>

  <!-- Botón flotante para la música de fondo -->
  <div class="music-floating-toggle">
    <button class="dark-music-btn" type="button" data-music-toggle aria-label="Reproducir nuestra canción" title="Reproducir música romántica">
      <span class="music-note-icon">🎵</span>
      <span class="music-label-text" data-music-label>Nuestra Canción</span>
      <div class="mini-equalizer" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>
    </button>
  </div>

  <!-- Pantalla principal única -->
  <main class="rose-screen-wrap">
    <!-- Encabezado con nombres y disculpa sincera -->
    <header class="rose-header">
      <h2><u><i>Charly y Isabel 💕❤️</i></u></h2>
      <h1 class="apology-title">
        Perdón por cada uno de mis errores.<br>
        <span class="apology-accent">No te quiero perder.</span>
      </h1>
      <p class="touch-hint-line">
        «Toca la flor para ver todos nuestros recuerdos juntos...»
      </p>
    </header>

    <!-- La Flor en su Cúpula de Cristal de CSS Puro con pétalo que va cayendo -->
    <a href="recuerdos.html" class="rose-interactive-anchor" id="bouquet-action" aria-label="Tocar la rosa para abrir nuestros recuerdos">
      <div class="container">
        <!-- Cúpula de Cristal -->
        <div class="glass"></div>

        <!-- Espinas del tallo -->
        <div class="thorns">
          <div></div><div></div><div></div><div></div>
        </div>

        <!-- Resplandor luminoso palpitante -->
        <div class="glow"></div>

        <!-- Hojas y tallo verde -->
        <div class="rose-leaves">
          <div></div><div></div>
        </div>

        <!-- Pétalos de la rosa -->
        <div class="rose-petals">
          <div></div><div></div><div></div><div></div>
          <div></div><div></div><div></div>
        </div>

        <!-- Chispas mágicas ascendentes -->
        <div class="sparkles">
          <div></div><div></div><div></div><div></div>
          <div></div><div></div><div></div><div></div>
          <div></div><div></div>
        </div>

        <!-- Pétalo que cae -->
        <div class="falling-petal"></div>
      </div>

      <!-- Badge interactivo debajo de la cúpula -->
      <div class="click-rose-badge">
        <span class="badge-sparkle">🌹</span>
        <span class="badge-text">Toca la rosa para entrar a nuestros recuerdos</span>
        <span class="badge-arrow">→</span>
      </div>
    </a>

    <!-- Barra inferior con enlace a recuerdos -->
    <footer class="rose-footer">
      <a href="recuerdos.html" class="dark-footer-pill">
        <span>💌 Ver cada recuerdo, fotos y videos</span>
      </a>
    </footer>
  </main>

  <!-- Elemento de audio -->
  <audio id="site-audio" loop preload="auto" aria-label="Canción romántica"></audio>
</body>
</html>
